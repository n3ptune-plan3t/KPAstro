name: Build Android APK

on:
  push:
    branches: [main, deepseek, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.4"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: kp-astro-apk-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Calculate next tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          # Stable namespace: X.Y.Z (tolerate an optional leading v on legacy tags).
          LATEST_STABLE=$(git tag -l --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          BASE="${LATEST_STABLE#v}"
          [ -z "$BASE" ] && BASE="0.0.0"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          NEXT_STABLE="${MAJOR}.${MINOR}.$((PATCH + 1))"

          BRANCH="$GITHUB_REF_NAME"
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)

          if [ "$BRANCH" = "main" ]; then
            TAG="$NEXT_STABLE"
            NAMED_APK="kp-astro-${TAG}.apk"
            cp "$APK_PATH" "$NAMED_APK"
            echo "Releasing stable version: $TAG"
            gh release create "$TAG" "$NAMED_APK" \
              --title "KP Astro ${TAG}" \
              --generate-notes
          else
            # Branch-scoped pre-release, kept separate from main's stable tags.
            SLUG=$(printf '%s' "$BRANCH" | tr '/ ' '--')
            LAST_N=$(git tag -l "${NEXT_STABLE}-${SLUG}.*" | awk -F"-${SLUG}." '{print $2}' | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
            N=$(( ${LAST_N:-0} + 1 ))
            TAG="${NEXT_STABLE}-${SLUG}.${N}"
            NAMED_APK="kp-astro-${TAG}.apk"
            cp "$APK_PATH" "$NAMED_APK"
            echo "Releasing pre-release version: $TAG (branch $BRANCH)"
            gh release create "$TAG" "$NAMED_APK" \
              --title "KP Astro ${TAG}" \
              --generate-notes \
              --prerelease \
              --latest=false
          fi
